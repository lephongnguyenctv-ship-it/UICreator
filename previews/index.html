<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game UI Preview Hub</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --hub-bg: #14171f;
      --hub-surface: #1e2330;
      --hub-surface-2: #252b3b;
      --hub-border: #31384a;
      --hub-text: #eef1f7;
      --hub-muted: #9aa4b8;
      --hub-accent: #f3c65f;
      --hub-good: #7ab855;
      --hub-good-bg: rgba(122, 184, 85, 0.16);
      --hub-bad: #ef4444;
      --hub-bad-bg: rgba(239, 68, 68, 0.16);
      --hub-warn: #eab308;
      --hub-warn-bg: rgba(234, 179, 8, 0.16);
      --hub-blue: #60a5fa;
      --hub-blue-bg: rgba(59, 130, 246, 0.18);
      --hub-font-ui: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
      --hub-font-mono: "Consolas", "Lucida Console", "Courier New", monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--hub-bg);
      color: var(--hub-text);
      font-family: var(--hub-font-ui);
      display: flex;
      flex-direction: column;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* Top Header */
    .hub-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--hub-surface);
      border-bottom: 1px solid var(--hub-border);
      padding: 12px 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.3);
    }

    .hub-brand {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .hub-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #fff7e4;
    }

    .hub-badge {
      background: rgba(243, 198, 95, 0.15);
      color: var(--hub-accent);
      border: 1px solid rgba(243, 198, 95, 0.35);
      border-radius: 6px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 700;
    }

    .hub-server-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid var(--hub-border);
      background: rgba(15, 20, 30, 0.55);
      color: var(--hub-muted);
    }

    .hub-server-pill.is-online {
      border-color: rgba(74, 222, 128, 0.45);
      background: rgba(47, 111, 62, 0.28);
      color: #86efac;
    }

    .hub-server-pill.is-offline {
      border-color: rgba(234, 179, 8, 0.4);
      background: rgba(234, 179, 8, 0.12);
      color: #fde68a;
    }

    .hub-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .hub-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hub-btn {
      appearance: none;
      background: #272d3d;
      color: var(--hub-text);
      border: 1px solid #3c455c;
      border-radius: 7px;
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease;
    }

    .hub-btn:hover {
      background: #323a4f;
      border-color: #4f5b78;
    }

    .hub-btn.is-active {
      background: #465836;
      border-color: var(--hub-good);
      color: #f4ffe8;
    }

    .hub-btn--primary {
      background: #2f6f3e;
      border-color: #4ade80;
      color: #f0fdf4;
    }

    .hub-btn--primary:hover {
      background: #388449;
    }

    .hub-btn--blue.is-active {
      background: #1e3a8a;
      border-color: var(--hub-blue);
      color: #eff6ff;
    }

    .hub-btn--edit {
      background: #0f4c6c;
      border-color: #38bdf8;
      color: #f0f9ff;
    }

    .hub-btn--edit:hover {
      background: #155e85;
    }

    .hub-btn--sm {
      padding: 5px 10px;
      font-size: 11px;
      border-radius: 6px;
    }

    /* Main Workspace */
    .hub-main {
      width: 100%;
      max-width: 1640px;
      margin: 0 auto;
      padding: 20px 24px 48px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .hub-panel {
      display: none;
      flex-direction: column;
      gap: 18px;
    }

    .hub-panel.is-active {
      display: flex;
    }

    /* Sub-Toolbar */
    .hub-toolbar {
      background: var(--hub-surface);
      border: 1px solid var(--hub-border);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .hub-toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .hub-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--hub-muted);
      font-weight: 700;
      margin-right: 2px;
    }

    .hub-input {
      background: #141821;
      color: var(--hub-text);
      border: 1px solid #3c455c;
      border-radius: 7px;
      padding: 7px 11px;
      font-size: 12px;
      min-width: 240px;
      outline: none;
    }

    .hub-input:focus {
      border-color: var(--hub-accent);
    }

    /* Grids */
    .hub-grid-grouped {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
      gap: 20px;
    }

    .hub-grid-expanded {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 16px;
    }

    @media (max-width: 640px) {
      .hub-grid-grouped,
      .hub-grid-expanded {
        grid-template-columns: 1fr;
      }
      .hub-input {
        min-width: 160px;
        width: 100%;
      }
    }

    /* UI Cards */
    .ui-card {
      background: var(--hub-surface);
      border: 1px solid var(--hub-border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
      transition: border-color 0.14s ease, transform 0.12s ease;
    }

    .ui-card:hover {
      border-color: #4b556e;
    }

    .ui-card-head {
      padding: 13px 16px;
      border-bottom: 1px solid var(--hub-border);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      background: rgba(15, 20, 30, 0.45);
    }

    .ui-card-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .ui-card-title {
      font-size: 15px;
      font-weight: 800;
      color: #fff7e4;
      margin: 0;
      line-height: 1.25;
    }

    .ui-card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: var(--hub-muted);
    }

    .ui-card-slug {
      font-family: var(--hub-font-mono);
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      color: #cbd5e1;
    }

    .qa-badge {
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .qa-badge.is-passed {
      background: var(--hub-good-bg);
      color: #a3e635;
      border: 1px solid rgba(163, 230, 53, 0.4);
    }

    .qa-badge.is-failed {
      background: var(--hub-bad-bg);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.45);
    }

    .qa-badge.is-unverified {
      background: var(--hub-warn-bg);
      color: #fde047;
      border: 1px solid rgba(234, 179, 8, 0.4);
    }

    /* 16:9 Screenshot Stage */
    .ui-card-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0d1017;
      overflow: hidden;
      border-bottom: 1px solid var(--hub-border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ui-card-stage-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .ui-card-shot {
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      display: block;
      transition: transform 0.16s ease;
    }

    .ui-card-stage-link:hover .ui-card-shot {
      transform: scale(1.015);
    }

    .ui-card-empty-shot {
      padding: 24px;
      text-align: center;
      color: var(--hub-muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .ui-card-thumb-switch {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
      display: inline-flex;
      background: rgba(15, 20, 30, 0.88);
      border: 1px solid #414b66;
      border-radius: 7px;
      padding: 3px;
      gap: 3px;
      backdrop-filter: blur(4px);
    }

    .ui-card-thumb-btn {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--hub-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
    }

    .ui-card-thumb-btn.is-active {
      background: #334155;
      color: #fff;
    }

    .ui-card-thumb-btn[data-card-thumb="wireframe"].is-active {
      background: #1e3a8a;
      color: #dbeafe;
    }

    /* View Pills */
    .ui-card-views {
      padding: 10px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid rgba(49, 56, 74, 0.65);
      background: rgba(20, 23, 31, 0.35);
    }

    .ui-view-pill {
      appearance: none;
      background: #232938;
      color: #cbd5e1;
      border: 1px solid #374158;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .ui-view-pill:hover {
      background: #2e364a;
      color: #fff;
    }

    .ui-view-pill.is-active {
      background: rgba(243, 198, 95, 0.18);
      border-color: var(--hub-accent);
      color: #fff7e4;
    }

    /* Footer Actions */
    .ui-card-actions {
      padding: 11px 14px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: auto;
    }

    /* Catalog Tab */
    .catalog-section-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--hub-accent);
      margin: 4px 0 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .contact-sheets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }

    .sheet-card {
      background: var(--hub-surface);
      border: 1px solid var(--hub-border);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: border-color 0.12s ease;
    }

    .sheet-card:hover {
      border-color: var(--hub-accent);
    }

    .sheet-thumb-wrap {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #181a20;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--hub-border);
    }

    .sheet-thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top left;
      image-rendering: pixelated;
    }

    .sheet-card-foot {
      padding: 9px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    .sprites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 12px;
    }

    .sprite-card {
      background: var(--hub-surface);
      border: 1px solid var(--hub-border);
      border-radius: 9px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      transition: border-color 0.12s ease;
    }

    .sprite-card:hover {
      border-color: var(--hub-accent);
    }

    .sprite-checker {
      height: 92px;
      border-radius: 6px;
      border: 1px solid #3c455c;
      background-color: #2b303a;
      background-image:
        linear-gradient(45deg, #373d4a 25%, transparent 25%),
        linear-gradient(-45deg, #373d4a 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #373d4a 75%),
        linear-gradient(-45deg, transparent 75%, #373d4a 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      overflow: hidden;
    }

    .sprite-checker img {
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
      object-fit: contain;
    }

    .sprite-id {
      font-family: var(--hub-font-mono);
      font-size: 11px;
      font-weight: 700;
      color: #fff7e4;
      word-break: break-all;
    }

    .sprite-meta {
      font-size: 10px;
      color: var(--hub-muted);
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .hub-empty {
      background: var(--hub-surface);
      border: 1px dashed var(--hub-border);
      border-radius: 10px;
      padding: 36px 20px;
      text-align: center;
      color: var(--hub-muted);
      font-size: 14px;
    }

    /* Lightbox Modal */
    .hub-modal {
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(8, 10, 15, 0.86);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .hub-modal.is-open {
      display: flex;
    }

    .hub-modal-box {
      background: var(--hub-surface);
      border: 1px solid var(--hub-border);
      border-radius: 12px;
      max-width: 95vw;
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.65);
    }

    .hub-modal-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--hub-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-weight: 700;
      font-size: 13px;
    }

    .hub-modal-body {
      padding: 16px;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #14171f;
    }

    .hub-modal-body img {
      max-width: 100%;
      height: auto;
      image-rendering: pixelated;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <header class="hub-header">
    <div class="hub-brand">
      <span class="hub-title">Game UI Preview Hub</span>
      <span id="hub-ui-count" class="hub-badge">0 UIs</span>
      <span id="hub-screen-count" class="hub-badge">0 Screens</span>
      <span id="hub-server-status" class="hub-server-pill">
        <span class="hub-status-dot"></span>
        <span>Checking mode...</span>
      </span>
    </div>

    <nav class="hub-tabs" aria-label="Hub Sections">
      <button type="button" class="hub-btn is-active" data-hub-tab="previews">UI Previews</button>
      <button type="button" class="hub-btn" data-hub-tab="catalog">Sprite Catalog &amp; Contact Sheets</button>
    </nav>
  </header>

  <main class="hub-main">
    <!-- Tab 1: UI Previews -->
    <section id="hub-panel-previews" class="hub-panel is-active" aria-label="UI Previews Gallery">
      <div class="hub-toolbar">
        <div class="hub-toolbar-group">
          <span class="hub-label">View</span>
          <button type="button" class="hub-btn hub-btn--sm is-active" data-hub-layout="grouped">Group by UI</button>
          <button type="button" class="hub-btn hub-btn--sm" data-hub-layout="expanded">Expand All Screens</button>
        </div>

        <div class="hub-toolbar-group">
          <span class="hub-label">Thumbnails</span>
          <button type="button" class="hub-btn hub-btn--sm is-active" data-hub-thumb-mode="final">Final UI</button>
          <button type="button" class="hub-btn hub-btn--sm hub-btn--blue" data-hub-thumb-mode="wireframe">Wireframe</button>
        </div>

        <div class="hub-toolbar-group">
          <input id="hub-search-input" class="hub-input" type="search" placeholder="Search UIs or screen views..." aria-label="Search UIs or screen views">
          <button type="button" id="hub-refresh-btn" class="hub-btn hub-btn--sm" style="display:none;" title="Rescan previews directory from backend">Refresh</button>
        </div>
      </div>

      <div id="hub-previews-container"></div>
    </section>

    <!-- Tab 2: Sprite Catalog & Contact Sheets -->
    <section id="hub-panel-catalog" class="hub-panel" aria-label="Shared Sprite Catalog">
      <div class="hub-toolbar">
        <div class="hub-toolbar-group">
          <span class="hub-label">Show</span>
          <button type="button" class="hub-btn hub-btn--sm is-active" data-catalog-section="both">All</button>
          <button type="button" class="hub-btn hub-btn--sm" data-catalog-section="sheets">Contact Sheets</button>
          <button type="button" class="hub-btn hub-btn--sm" data-catalog-section="slices">Sliced Sprites</button>
        </div>

        <div class="hub-toolbar-group" id="hub-cat-filters">
          <span class="hub-label">Category</span>
          <button type="button" class="hub-btn hub-btn--sm is-active" data-cat-filter="all">All</button>
          <button type="button" class="hub-btn hub-btn--sm" data-cat-filter="panel">Panel</button>
          <button type="button" class="hub-btn hub-btn--sm" data-cat-filter="button">Button</button>
          <button type="button" class="hub-btn hub-btn--sm" data-cat-filter="dialog">Dialog</button>
          <button type="button" class="hub-btn hub-btn--sm" data-cat-filter="icon">Icon</button>
          <button type="button" class="hub-btn hub-btn--sm" data-cat-filter="emote">Emote</button>
          <button type="button" class="hub-btn hub-btn--sm" data-cat-filter="cursor">Cursor</button>
        </div>

        <div class="hub-toolbar-group">
          <input id="hub-sprite-search" class="hub-input" type="search" placeholder="Search slice ID or source PNG..." aria-label="Search slice ID or source PNG">
        </div>
      </div>

      <div id="hub-contact-sheets-block">
        <div class="catalog-section-title">
          <span>Contact Sheets</span>
          <span id="hub-sheets-count" class="hub-badge">0</span>
        </div>
        <div id="hub-sheets-grid" class="contact-sheets-grid"></div>
      </div>

      <div id="hub-slices-block">
        <div class="catalog-section-title">
          <span>Sliced Sprites</span>
          <span id="hub-slices-count" class="hub-badge">0</span>
        </div>
        <div id="hub-slices-grid" class="sprites-grid"></div>
      </div>
    </section>
  </main>

  <div id="hub-lightbox" class="hub-modal" role="dialog" aria-modal="true" aria-label="Asset Lightbox">
    <div class="hub-modal-box">
      <div class="hub-modal-head">
        <span id="hub-lightbox-title">Asset Preview</span>
        <button type="button" id="hub-lightbox-close" class="hub-btn hub-btn--sm">Close</button>
      </div>
      <div class="hub-modal-body">
        <img id="hub-lightbox-img" src="" alt="">
      </div>
    </div>
  </div>

  <script src="./_catalog/catalog-data.js"></script>
  <script src="./_catalog/previews-data.js"></script>
  <script>
    (function () {
      'use strict';

      const state = {
        activeTab: 'previews',
        layout: 'grouped',
        globalThumbMode: 'final',
        search: '',
        cardActiveView: {},
        cardThumbMode: {},
        catalogSection: 'both',
        catalogCategory: 'all',
        spriteSearch: '',
        previewsCatalog: window.UI_PREVIEWS_CATALOG || { previews: [] },
        spriteCatalog: window.SPRITE_CATALOG || { contact_sheets: [], slices: {} },
      };

      function esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function getPreviews() {
        return Array.isArray(state.previewsCatalog.previews) ? state.previewsCatalog.previews : [];
      }

      function updateHeaderCounts() {
        const previews = getPreviews();
        const totalScreens = previews.reduce((acc, p) => acc + (Array.isArray(p.views) ? p.views.length : 0), 0);
        const uiEl = document.getElementById('hub-ui-count');
        const scrEl = document.getElementById('hub-screen-count');
        if (uiEl) uiEl.textContent = `${previews.length} UI${previews.length === 1 ? '' : 's'}`;
        if (scrEl) scrEl.textContent = `${totalScreens} Screen${totalScreens === 1 ? '' : 's'}`;
      }

      function setServerStatus(online, text) {
        const pill = document.getElementById('hub-server-status');
        if (!pill) return;
        pill.classList.toggle('is-online', Boolean(online));
        pill.classList.toggle('is-offline', !online);
        const label = pill.querySelector('span:last-child');
        if (label) label.textContent = text;
      }

      async function checkBackendAndRefresh() {
        const isHttp = /^https?:$/i.test(window.location.protocol);
        const refreshBtn = document.getElementById('hub-refresh-btn');
        if (!isHttp) {
          setServerStatus(false, 'Offline / Static File Mode — Run launch_ui_hub.bat for live saving');
          if (refreshBtn) refreshBtn.style.display = 'none';
          return;
        }
        try {
          const pingRes = await fetch('/api/ping', { cache: 'no-store' });
          if (pingRes.ok) {
            const port = window.location.port || '17890';
            setServerStatus(true, `Backend Connected :${port}`);
            if (refreshBtn) refreshBtn.style.display = 'inline-flex';
            const prevRes = await fetch('/api/previews', { cache: 'no-store' });
            if (prevRes.ok) {
              const data = await prevRes.json();
              if (data && Array.isArray(data.previews)) {
                state.previewsCatalog = data;
                updateHeaderCounts();
                renderPreviews();
              }
            }
          } else {
            setServerStatus(false, 'Static HTTP Mode — Run launch_ui_hub.bat for Studio Save');
          }
        } catch {
          setServerStatus(false, 'Offline / Static File Mode — Run launch_ui_hub.bat for live saving');
        }
      }

      function getQaBadgeHtml(verification) {
        const status = (verification && verification.status) || 'UNVERIFIED';
        const tested = verification && verification.summary ? verification.summary.statesTested : 0;
        if (status === 'PASSED') {
          return `<span class="qa-badge is-passed">PASSED${tested ? ` · ${tested} states` : ''}</span>`;
        }
        if (status === 'FAILED') {
          return `<span class="qa-badge is-failed">FAILED</span>`;
        }
        return `<span class="qa-badge is-unverified">UNVERIFIED</span>`;
      }

      function getViewShot(view, thumbMode) {
        if (!view) return '';
        if (thumbMode === 'wireframe') {
          return view.wireframe_screenshot || view.final_screenshot || '';
        }
        return view.final_screenshot || view.wireframe_screenshot || '';
      }

      function buildStageHtml(slug, view, thumbMode, cardKey) {
        const shotPath = getViewShot(view, thumbMode);
        const targetMode = thumbMode === 'wireframe' ? 'wireframe' : 'final';
        const viewId = view ? view.id : 'main';
        const href = `./${encodeURIComponent(slug)}/index.html?state=${encodeURIComponent(viewId)}&mode=${targetMode}`;

        const inner = shotPath
          ? `<img class="ui-card-shot" src="./${esc(shotPath)}" alt="${esc(slug)} - ${esc(viewId)} (${esc(thumbMode)})" loading="lazy">`
          : `<div class="ui-card-empty-shot">No ${esc(thumbMode)} screenshot captured yet for <code>${esc(viewId)}</code>.<br>Click to open live preview or run <code>verify_ui.mjs</code>.</div>`;

        return `
          <div class="ui-card-stage">
            <a class="ui-card-stage-link" href="${esc(href)}" title="Open ${esc(viewId)} in ${esc(targetMode)} mode">
              ${inner}
            </a>
            <div class="ui-card-thumb-switch" data-card-key="${esc(cardKey)}">
              <button type="button" class="ui-card-thumb-btn ${thumbMode === 'final' ? 'is-active' : ''}" data-card-thumb="final">Final</button>
              <button type="button" class="ui-card-thumb-btn ${thumbMode === 'wireframe' ? 'is-active' : ''}" data-card-thumb="wireframe">Wireframe</button>
            </div>
          </div>
        `;
      }

      function renderGroupedPreviews(previews, query) {
        const filtered = previews.filter(p => {
          if (!query) return true;
          const hay = [
            p.title,
            p.slug,
            ...(p.views || []).map(v => `${v.id} ${v.label}`),
          ]
            .join(' ')
            .toLowerCase();
          return hay.includes(query);
        });

        if (!filtered.length) {
          return '<div class="hub-empty">No matching UI previews found. Create one with <code>scaffold_preview.py</code> or clear the search filter.</div>';
        }

        const cards = filtered
          .map(p => {
            const views = Array.isArray(p.views) && p.views.length ? p.views : [{ id: 'main', label: 'Main' }];
            const activeViewId = state.cardActiveView[p.slug] || views[0].id;
            const activeView = views.find(v => v.id === activeViewId) || views[0];
            const thumbMode = state.cardThumbMode[p.slug] || state.globalThumbMode;

            const viewsHtml = views
              .map(
                v =>
                  `<button type="button" class="ui-view-pill ${v.id === activeView.id ? 'is-active' : ''}" data-card-slug="${esc(p.slug)}" data-card-view="${esc(v.id)}">${esc(v.label || v.id)}</button>`
              )
              .join('');

            const slugEnc = encodeURIComponent(p.slug);
            const viewEnc = encodeURIComponent(activeView.id);

            return `
              <article class="ui-card" data-ui-slug="${esc(p.slug)}">
                <div class="ui-card-head">
                  <div class="ui-card-title-wrap">
                    <h2 class="ui-card-title">${esc(p.title)}</h2>
                    <div class="ui-card-meta">
                      <span class="ui-card-slug">${esc(p.slug)}</span>
                      <span>${views.length} view${views.length === 1 ? '' : 's'}</span>
                      <span>${p.sprite_count || 0} sprites</span>
                    </div>
                  </div>
                  ${getQaBadgeHtml(p.verification)}
                </div>
                ${buildStageHtml(p.slug, activeView, thumbMode, p.slug)}
                <div class="ui-card-views" aria-label="Screen Views">${viewsHtml}</div>
                <div class="ui-card-actions">
                  <a class="hub-btn hub-btn--sm hub-btn--primary" href="./${slugEnc}/index.html?state=${viewEnc}&amp;mode=final">Open Interactive →</a>
                  <a class="hub-btn hub-btn--sm hub-btn--edit" href="./${slugEnc}/index.html?state=${viewEnc}&amp;mode=edit">Edit UI / 9-Slice</a>
                  <a class="hub-btn hub-btn--sm" href="./${slugEnc}/index.html?state=${viewEnc}&amp;mode=wireframe">Wireframe &amp; Spec</a>
                </div>
              </article>
            `;
          })
          .join('');

        return `<div class="hub-grid-grouped">${cards}</div>`;
      }

      function renderExpandedScreens(previews, query) {
        const screenEntries = [];
        previews.forEach(p => {
          const views = Array.isArray(p.views) && p.views.length ? p.views : [{ id: 'main', label: 'Main' }];
          views.forEach(v => {
            const hay = `${p.title} ${p.slug} ${v.id} ${v.label}`.toLowerCase();
            if (!query || hay.includes(query)) {
              screenEntries.push({ preview: p, view: v });
            }
          });
        });

        if (!screenEntries.length) {
          return '<div class="hub-empty">No matching screen views found.</div>';
        }

        const cards = screenEntries
          .map(({ preview: p, view: v }) => {
            const cardKey = `${p.slug}::${v.id}`;
            const thumbMode = state.cardThumbMode[cardKey] || state.globalThumbMode;
            const slugEnc = encodeURIComponent(p.slug);
            const viewEnc = encodeURIComponent(v.id);

            return `
              <article class="ui-card" data-screen-key="${esc(cardKey)}">
                <div class="ui-card-head">
                  <div class="ui-card-title-wrap">
                    <h2 class="ui-card-title">${esc(v.label || v.id)}</h2>
                    <div class="ui-card-meta">
                      <span>${esc(p.title)}</span>
                      <span class="ui-card-slug">${esc(p.slug)} / ${esc(v.id)}</span>
                    </div>
                  </div>
                  ${getQaBadgeHtml(p.verification)}
                </div>
                ${buildStageHtml(p.slug, v, thumbMode, cardKey)}
                <div class="ui-card-actions">
                  <a class="hub-btn hub-btn--sm hub-btn--primary" href="./${slugEnc}/index.html?state=${viewEnc}&amp;mode=final">Interactive</a>
                  <a class="hub-btn hub-btn--sm hub-btn--edit" href="./${slugEnc}/index.html?state=${viewEnc}&amp;mode=edit">Edit UI</a>
                  <a class="hub-btn hub-btn--sm" href="./${slugEnc}/index.html?state=${viewEnc}&amp;mode=wireframe">Wireframe</a>
                </div>
              </article>
            `;
          })
          .join('');

        return `<div class="hub-grid-expanded">${cards}</div>`;
      }

      function renderPreviews() {
        const container = document.getElementById('hub-previews-container');
        if (!container) return;
        const previews = getPreviews();
        const query = state.search.trim().toLowerCase();
        container.innerHTML =
          state.layout === 'expanded'
            ? renderExpandedScreens(previews, query)
            : renderGroupedPreviews(previews, query);
      }

      function renderCatalog() {
        const catalog = state.spriteCatalog || {};
        const sheets = Array.isArray(catalog.contact_sheets) ? catalog.contact_sheets : [];
        const slicesObj = catalog.slices && typeof catalog.slices === 'object' ? catalog.slices : {};
        const allSlices = Object.values(slicesObj);
        const query = state.spriteSearch.trim().toLowerCase();

        const sheetsBlock = document.getElementById('hub-contact-sheets-block');
        const slicesBlock = document.getElementById('hub-slices-block');
        if (sheetsBlock) {
          sheetsBlock.style.display = state.catalogSection === 'slices' ? 'none' : 'block';
        }
        if (slicesBlock) {
          slicesBlock.style.display = state.catalogSection === 'sheets' ? 'none' : 'block';
        }

        const filteredSheets = sheets.filter(s => !query || s.toLowerCase().includes(query));
        const sheetsCount = document.getElementById('hub-sheets-count');
        const sheetsGrid = document.getElementById('hub-sheets-grid');
        if (sheetsCount) sheetsCount.textContent = String(filteredSheets.length);
        if (sheetsGrid) {
          sheetsGrid.innerHTML = filteredSheets.length
            ? filteredSheets
                .map(rel => {
                  const name = rel.split('/').pop();
                  const imgSrc = `./_catalog/${rel}`;
                  return `
                    <div class="sheet-card" data-lightbox-src="${esc(imgSrc)}" data-lightbox-title="${esc(name)}">
                      <div class="sheet-thumb-wrap">
                        <img src="${esc(imgSrc)}" alt="${esc(name)}" loading="lazy">
                      </div>
                      <div class="sheet-card-foot">
                        <span>${esc(name)}</span>
                        <span class="hub-label">Click to zoom</span>
                      </div>
                    </div>
                  `;
                })
                .join('')
            : '<div class="hub-empty">No matching contact sheets.</div>';
        }

        const filteredSlices = allSlices.filter(rec => {
          if (state.catalogCategory !== 'all' && rec.category !== state.catalogCategory) return false;
          if (!query) return true;
          return (
            String(rec.id || '').toLowerCase().includes(query) ||
            String(rec.source_file || '').toLowerCase().includes(query) ||
            String(rec.category || '').toLowerCase().includes(query)
          );
        });

        const slicesCount = document.getElementById('hub-slices-count');
        const slicesGrid = document.getElementById('hub-slices-grid');
        if (slicesCount) slicesCount.textContent = `${filteredSlices.length} / ${allSlices.length}`;
        if (slicesGrid) {
          slicesGrid.innerHTML = filteredSlices.length
            ? filteredSlices
                .map(rec => {
                  const imgSrc = `./_catalog/${rec.file}`;
                  const slice9 = Array.isArray(rec.slice_9) ? `9s:[${rec.slice_9.join(',')}]` : rec.category;
                  return `
                    <div class="sprite-card" data-lightbox-src="${esc(imgSrc)}" data-lightbox-title="${esc(rec.id)} (${rec.width}x${rec.height} · ${esc(rec.source_file)})">
                      <div class="sprite-checker">
                        <img src="${esc(imgSrc)}" alt="${esc(rec.id)}" loading="lazy">
                      </div>
                      <div class="sprite-id">${esc(rec.id)}</div>
                      <div class="sprite-meta">
                        <span>${rec.width}×${rec.height}</span>
                        <span>${esc(slice9)}</span>
                      </div>
                    </div>
                  `;
                })
                .join('')
            : '<div class="hub-empty">No matching sliced sprites found.</div>';
        }
      }

      function setActiveTab(tabName) {
        state.activeTab = tabName === 'catalog' ? 'catalog' : 'previews';
        document.querySelectorAll('[data-hub-tab]').forEach(btn => {
          btn.classList.toggle('is-active', btn.getAttribute('data-hub-tab') === state.activeTab);
        });
        document.getElementById('hub-panel-previews')?.classList.toggle('is-active', state.activeTab === 'previews');
        document.getElementById('hub-panel-catalog')?.classList.toggle('is-active', state.activeTab === 'catalog');
        if (state.activeTab === 'catalog') renderCatalog();
      }

      function setLayout(layout) {
        state.layout = layout === 'expanded' ? 'expanded' : 'grouped';
        document.querySelectorAll('[data-hub-layout]').forEach(btn => {
          btn.classList.toggle('is-active', btn.getAttribute('data-hub-layout') === state.layout);
        });
        renderPreviews();
      }

      function setGlobalThumbMode(mode) {
        state.globalThumbMode = mode === 'wireframe' ? 'wireframe' : 'final';
        state.cardThumbMode = {};
        document.querySelectorAll('[data-hub-thumb-mode]').forEach(btn => {
          btn.classList.toggle('is-active', btn.getAttribute('data-hub-thumb-mode') === state.globalThumbMode);
        });
        renderPreviews();
      }

      function openLightbox(src, title) {
        const modal = document.getElementById('hub-lightbox');
        const img = document.getElementById('hub-lightbox-img');
        const label = document.getElementById('hub-lightbox-title');
        if (!modal || !img) return;
        img.src = src;
        img.alt = title || 'Asset preview';
        if (label) label.textContent = title || 'Asset Preview';
        modal.classList.add('is-open');
      }

      function closeLightbox() {
        const modal = document.getElementById('hub-lightbox');
        if (modal) modal.classList.remove('is-open');
      }

      function wireEvents() {
        document.addEventListener('click', evt => {
          const tabBtn = evt.target.closest('[data-hub-tab]');
          if (tabBtn) {
            setActiveTab(tabBtn.getAttribute('data-hub-tab'));
            return;
          }

          const layoutBtn = evt.target.closest('[data-hub-layout]');
          if (layoutBtn) {
            setLayout(layoutBtn.getAttribute('data-hub-layout'));
            return;
          }

          const globalThumbBtn = evt.target.closest('[data-hub-thumb-mode]');
          if (globalThumbBtn) {
            setGlobalThumbMode(globalThumbBtn.getAttribute('data-hub-thumb-mode'));
            return;
          }

          const viewPill = evt.target.closest('[data-card-view]');
          if (viewPill) {
            const slug = viewPill.getAttribute('data-card-slug');
            const viewId = viewPill.getAttribute('data-card-view');
            if (slug && viewId) {
              state.cardActiveView[slug] = viewId;
              renderPreviews();
            }
            return;
          }

          const cardThumbBtn = evt.target.closest('[data-card-thumb]');
          if (cardThumbBtn) {
            evt.preventDefault();
            evt.stopPropagation();
            const wrap = cardThumbBtn.closest('[data-card-key]');
            const key = wrap && wrap.getAttribute('data-card-key');
            const nextMode = cardThumbBtn.getAttribute('data-card-thumb');
            if (key && nextMode) {
              state.cardThumbMode[key] = nextMode;
              renderPreviews();
            }
            return;
          }

          const secBtn = evt.target.closest('[data-catalog-section]');
          if (secBtn) {
            state.catalogSection = secBtn.getAttribute('data-catalog-section') || 'both';
            document.querySelectorAll('[data-catalog-section]').forEach(b => {
              b.classList.toggle('is-active', b.getAttribute('data-catalog-section') === state.catalogSection);
            });
            renderCatalog();
            return;
          }

          const catBtn = evt.target.closest('[data-cat-filter]');
          if (catBtn) {
            state.catalogCategory = catBtn.getAttribute('data-cat-filter') || 'all';
            document.querySelectorAll('[data-cat-filter]').forEach(b => {
              b.classList.toggle('is-active', b.getAttribute('data-cat-filter') === state.catalogCategory);
            });
            renderCatalog();
            return;
          }

          const lightboxTrigger = evt.target.closest('[data-lightbox-src]');
          if (lightboxTrigger) {
            openLightbox(
              lightboxTrigger.getAttribute('data-lightbox-src'),
              lightboxTrigger.getAttribute('data-lightbox-title')
            );
            return;
          }

          if (evt.target.id === 'hub-lightbox-close' || evt.target.id === 'hub-lightbox') {
            closeLightbox();
            return;
          }

          if (evt.target.id === 'hub-refresh-btn') {
            checkBackendAndRefresh();
          }
        });

        document.addEventListener('keydown', evt => {
          if (evt.key === 'Escape') closeLightbox();
        });

        document.getElementById('hub-search-input')?.addEventListener('input', evt => {
          state.search = evt.target.value || '';
          renderPreviews();
        });

        document.getElementById('hub-sprite-search')?.addEventListener('input', evt => {
          state.spriteSearch = evt.target.value || '';
          renderCatalog();
        });
      }

      function init() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('layout') === 'expanded') state.layout = 'expanded';
        if (params.get('thumb') === 'wireframe') state.globalThumbMode = 'wireframe';

        wireEvents();
        updateHeaderCounts();

        document.querySelectorAll('[data-hub-layout]').forEach(btn => {
          btn.classList.toggle('is-active', btn.getAttribute('data-hub-layout') === state.layout);
        });
        document.querySelectorAll('[data-hub-thumb-mode]').forEach(btn => {
          btn.classList.toggle('is-active', btn.getAttribute('data-hub-thumb-mode') === state.globalThumbMode);
        });

        if (params.get('tab') === 'catalog') {
          setActiveTab('catalog');
        } else {
          renderPreviews();
        }
        checkBackendAndRefresh();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
</html>
